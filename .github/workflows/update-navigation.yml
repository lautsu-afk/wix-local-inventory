name: Update Wix category navigation

on:
  workflow_dispatch:
  # Wix CMS Kategoriahierarkia data.js calls GitHub repository_dispatch.
  repository_dispatch:
    types: [wix-category-navigation]
  push:
    branches: [main]
    paths:
      - "navigation_config.json"
      - "generate_navigation.py"
      - ".github/workflows/update-navigation.yml"

permissions:
  contents: write

concurrency:
  group: wix-category-navigation
  cancel-in-progress: false

jobs:
  navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build navigation from Wix Stores Catalog V1
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: ${{ secrets.WIX_SITE_ID }}
        run: python generate_navigation.py

      - name: Commit and publish navigation updates safely
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: ${{ secrets.WIX_SITE_ID }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Multiple Wix CMS changes can trigger numerous repository_dispatch
          # runs. Never rebase generated JSON/JS: concurrent changes to those
          # files conflict even when both contain valid navigation updates.
          # On a push race, reset ONLY the runner's checkout to the latest
          # remote main, re-query Wix, and regenerate both derived files.
          for attempt in 1 2 3 4 5; do
            if [ "$attempt" -gt 1 ]; then
              echo "Refreshing navigation from latest main (attempt $attempt)"
              git fetch origin main
              git reset --hard origin/main
              python generate_navigation.py
            fi

            if [ -z "$(git status --porcelain -- docs/navigation.json docs/navigation.js)" ]; then
              echo "Navigation already current; nothing to publish."
              exit 0
            fi

            git add docs/navigation.json docs/navigation.js
            if git diff --cached --quiet; then
              echo "No navigation changes."
              exit 0
            fi
            git commit -m "Update Wix category navigation"

            if git push origin HEAD:main; then
              echo "Published navigation data."
              exit 0
            fi

            echo "Concurrent update detected; will rebuild against latest main."
            sleep $((attempt * 2))
          done

          echo "Unable to publish navigation after five fresh rebuild attempts." >&2
          exit 1
