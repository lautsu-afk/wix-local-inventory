name: Update Wix category navigation

on:
  workflow_dispatch:
  # Wix CMS Kategoriahierarkia data.js calls GitHub repository_dispatch.
  repository_dispatch:
    types: [wix-category-navigation]
  push:
    branches: [main]
    paths:
      - "navigation_config.json"
      - "generate_navigation.py"
      - ".github/workflows/update-navigation.yml"

permissions:
  contents: write

concurrency:
  group: wix-category-navigation
  cancel-in-progress: false

jobs:
  navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build navigation from Wix Stores Catalog V1
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: ${{ secrets.WIX_SITE_ID }}
        run: python generate_navigation.py

      - name: Commit and publish navigation updates
        run: |
          if [ -z "$(git status --porcelain docs/navigation.json docs/navigation.js)" ]; then
            echo "No navigation changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/navigation.json docs/navigation.js
          git diff --cached --quiet && exit 0
          git commit -m "Update Wix category navigation"
          for attempt in 1 2 3; do
            git pull --rebase origin main || exit 1
            if git push; then
              echo "Published navigation data."
              exit 0
            fi
            sleep 3
          done
          echo "Unable to publish navigation after retries." >&2
          exit 1
