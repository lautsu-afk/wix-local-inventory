name: Update Wix local inventory

on:
  workflow_dispatch:

  schedule:
    - cron: "15 23 * * *"
      timezone: "Europe/Helsinki"
    # Wix CMS navigation: independent five-minute schedule on the
    # repository's already-established scheduled workflow.
    - cron: "3-59/5 * * * *"

permissions:
  contents: write

jobs:
  update-inventory:
    # Keep the existing inventory / Google Ads feed strictly on the original
    # nightly schedule and on-demand runs. Never run it every five minutes.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '15 23 * * *' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate local inventory feed
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: ${{ secrets.WIX_SITE_ID }}
          STORE_CODE: ${{ secrets.STORE_CODE }}
        run: python update_inventory.py

      - name: Commit updated inventory feed
        run: |
          if [ -z "$(git status --porcelain docs/)" ]; then
            echo "Inventory data has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/local_inventory.tsv docs/index.html docs/.nojekyll
          git diff --cached --quiet && exit 0
          git commit -m "Update local inventory feed"
          git push

      - name: Generate local Shopping custom labels
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: ${{ secrets.WIX_SITE_ID }}
        run: python generate_local_ads_labels.py

      - name: Commit updated local Shopping labels
        run: |
          if [ -z "$(git status --porcelain docs/local_ads_labels.tsv)" ]; then
            echo "Local Shopping labels have not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/local_ads_labels.tsv
          git commit -m "Update local Shopping product labels"
          git push

  navigation-fallback:
    # Run every five minutes and on the existing nightly schedule.
    # The separate Update Wix category navigation workflow still handles
    # immediate push/manual builds.
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    concurrency:
      group: wix-category-navigation
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install navigation dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh Wix navigation from CMS
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: ${{ secrets.WIX_SITE_ID }}
        run: python generate_navigation.py

      - name: Commit updated navigation when needed
        run: |
          if [ -z "$(git status --porcelain docs/navigation.json docs/navigation.js)" ]; then
            echo "Navigation already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/navigation.json docs/navigation.js
          git diff --cached --quiet && exit 0
          git commit -m "Update Wix category navigation"
          for attempt in 1 2 3; do
            git pull --rebase origin main || exit 1
            if git push; then
              echo "Published navigation data."
              exit 0
            fi
            sleep 3
          done
          echo "Unable to publish navigation after retries." >&2
          exit 1
