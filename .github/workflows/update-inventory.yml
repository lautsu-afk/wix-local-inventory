name: Update Wix local inventory

on:
  workflow_dispatch:

  schedule:
    - cron: "15 23 * * *"
      timezone: "Europe/Helsinki"

permissions:
  contents: write

jobs:
  update-inventory:
    # Keep the existing inventory / Google Ads feed strictly on the original
    # nightly schedule and on-demand runs. Never run it every five minutes.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '15 23 * * *' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate local inventory feed
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: ${{ secrets.WIX_SITE_ID }}
          STORE_CODE: ${{ secrets.STORE_CODE }}
        run: python update_inventory.py

      - name: Commit updated inventory feed
        run: |
          if [ -z "$(git status --porcelain docs/)" ]; then
            echo "Inventory data has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/local_inventory.tsv docs/index.html docs/.nojekyll
          git diff --cached --quiet && exit 0
          git commit -m "Update local inventory feed"
          git push

      - name: Generate local Shopping custom labels
        env:
          WIX_API_KEY: ${{ secrets.WIX_API_KEY }}
          WIX_SITE_ID: ${{ secrets.WIX_SITE_ID }}
        run: python generate_local_ads_labels.py

      - name: Commit updated local Shopping labels
        run: |
          if [ -z "$(git status --porcelain docs/local_ads_labels.tsv)" ]; then
            echo "Local Shopping labels have not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/local_ads_labels.tsv
          git commit -m "Update local Shopping product labels"
          git push
